<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__LOCAL_TOKEN__"><link rel="icon" href="/icons/bookmark-simple.svg" type="image/svg+xml"><title>Reference Library</title><link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="topbar"><a class="wordmark" href="/">Reference library</a><nav aria-label="Library sections"><button class="tab active" id="tab-x" aria-pressed="true">X bookmarks <span id="count-x">0</span></button><button class="tab" id="tab-web" aria-pressed="false">Websites <span id="count-web">0</span></button></nav><label class="search"><img src="/icons/magnifying-glass.svg" alt=""><input id="search" type="search" aria-label="Search references" placeholder="Search your references"></label><details class="utility-menu account-menu"><summary aria-label="Library menu" title="Library menu"><img src="/icons/user.svg" alt=""></summary><div class="menu-panel account-panel"><p id="privacy-status">Private · Saved on this Mac</p><p id="sync-status">Loading your library…</p><fieldset class="theme-setting"><legend>Appearance</legend><div class="theme-options"><button type="button" data-theme-choice="system" aria-pressed="true">System</button><button type="button" data-theme-choice="light" aria-pressed="false">Light</button><button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button></div></fieldset><div id="connection-tools"></div><a class="lab-link menu-item" href="/lab">Capture Lab</a></div></details></header>
<main>
<p id="status" class="status" role="status" aria-live="polite"></p><div id="captures" class="masonry" aria-label="Saved references"></div>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="detail-layout"><aside class="detail-info"><div class="detail-nav"><button id="close-detail" class="icon-button" aria-label="Close detail"><img src="/icons/x.svg" alt=""></button><div><button id="previous-detail" class="icon-button" aria-label="Previous reference"><img src="/icons/arrow-left.svg" alt=""></button><button id="next-detail" class="icon-button" aria-label="Next reference"><img src="/icons/arrow-right.svg" alt=""></button></div></div><div id="detail-copy"></div></aside><div class="detail-stage" id="detail-stage"></div></div></dialog>
</body></html>
