<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__LOCAL_TOKEN__"><link rel="icon" href="/icons/bookmark-simple.svg" type="image/svg+xml"><title>Reference Library</title><link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="topbar">
<nav aria-label="Library sections"><div id="collection-menu"></div></nav>
<div id="folder-bar" class="folder-bar" hidden><p class="sr-only" id="folder-help">Select one or more folders. Shows bookmarks in any selected folder. All clears the selection.</p><div id="folder-filters" role="group" aria-label="Filter X bookmarks by folder" aria-describedby="folder-help"></div></div>
<div id="theme-control" class="theme-control"><button class="header-button theme-icon" type="button" data-theme-choice="dark" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode"><span class="theme-viewport" aria-hidden="true"><span class="theme-orbit"><span class="theme-body theme-sun"><img src="/icons/sun.svg" alt=""></span><span class="theme-body theme-moon"><img src="/icons/moon.svg" alt=""></span></span></span></button></div>
</header>
<section id="library-management" class="library-management" hidden aria-label="Library connections and settings"><a href="#" class="menu-item">Back to library</a><div class="account-panel"><p id="privacy-status">Private · Saved on this Mac</p><p id="sync-status">Loading your library…</p><div id="connection-tools"></div><a class="lab-link menu-item" href="/lab">Capture Lab</a></div></section>
<main>
<p id="folder-status" class="sr-only" role="status"></p>
<p id="status" class="status" role="status" aria-live="polite"></p><div id="captures" class="masonry" aria-label="Saved references"></div>
</main>
<dialog id="detail" aria-label="Bookmark viewer"><div class="detail-layout"><button id="close-detail" class="icon-button" aria-label="Close detail"><img src="/icons/x.svg" alt=""></button><div class="detail-stage" id="detail-stage"></div><div id="detail-footer"></div></div></dialog>
</body></html>
